<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="Painel de desempenho e gestão à vista." />
    <title>Gestão à Vista</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Em vez de tela branca: mostra o motivo quando o navegador não consegue abrir o painel. -->
    <script>
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          root.innerHTML = '<div style="font-family:Arial,sans-serif;max-width:640px;margin:12vh auto;padding:28px;border-radius:16px;background:#EAF8FA;color:#172538;line-height:1.5">' +
            '<h1 style="font-size:24px;margin:0 0 12px">N\u00e3o foi poss\u00edvel abrir o painel</h1>' +
            '<p style="margin:0 0 12px">' + msg + '</p>' +
            '<p style="margin:0;font-size:13px;color:#586675">Navegador: ' + String(navigator.userAgent).replace(/[<>&]/g, '') + '</p></div>';
        }
        window.__gavShowError = show;
        window.addEventListener('error', function (e) {
          show('Ocorreu um erro ao carregar: ' + String((e && e.message) || 'arquivo n\u00e3o carregado').replace(/[<>&]/g, '') + '. Recarregue a p\u00e1gina; se continuar, atualize o navegador do aparelho.');
        }, true);
        setTimeout(function () { show('O painel n\u00e3o carregou. Verifique a internet e recarregue a p\u00e1gina. Se continuar, o navegador deste aparelho pode estar desatualizado.'); }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
